name: Session 2 - Supabase Local Database Verification

on:
  push:
    branches:
      - db/daily-sequential-featured-lifecycle-20261123
      - db/session2-finalize-20261123
    paths:
      - "supabase/**"
      - ".github/workflows/session2-database-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/session2-database-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitebin-session2-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-and-test:
    name: Replay migrations and run isolated PostgreSQL acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Initialize local-only Supabase configuration when absent
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          if [[ ! -f supabase/config.toml ]]; then
            supabase init
          fi
          test -d supabase/migrations
          test -d supabase/tests
          test -f supabase/ci/bootstrap_platform.sql

          # The production project has a pre-existing RLS event trigger that
          # predates the tracked migration history. Disable automatic replay
          # during 'supabase start' so CI can install that prerequisite first.
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("supabase/config.toml")
          text = path.read_text()
          match = re.search(r"(?ms)^\\[db\\.migrations\\]\\s*(.*?)(?=^\\[|\\Z)", text)
          if match:
              section = match.group(0)
              if re.search(r"(?m)^enabled\\s*=", section):
                  section = re.sub(r"(?m)^enabled\\s*=.*$", "enabled = false", section, count=1)
              else:
                  section = section.replace("[db.migrations]", "[db.migrations]\\nenabled = false", 1)
              text = text[:match.start()] + section + text[match.end():]
          else:
              text = text.rstrip() + "\\n\\n[db.migrations]\\nenabled = false\\n"
          path.write_text(text)
          PY
          grep -A2 '^\\[db.migrations\\]' supabase/config.toml
          echo "Local migration and integration test directories verified."

      - name: Start disposable local Supabase without automatic migration replay
        run: supabase start

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Install the pre-existing platform RLS prerequisite locally
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          if [[ -z "$DB_URL" ]]; then
            echo "DB_URL was not reported by the local Supabase stack." >&2
            exit 1
          fi
          # This connects only to the local disposable DB. The script sources
          # the same versioned SQL migration that records the prerequisite.
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/ci/bootstrap_platform.sql

      - name: Replay every versioned migration locally
        shell: bash
        run: |
          set -euo pipefail
          # Explicit local target only. No project link, remote DB URL, access
          # token, production password, or production connection is configured.
          supabase migration up --local
          supabase migration list --local

      - name: Run every isolated SQL acceptance suite and concurrency test
        shell: bash
        run: |
          set -uo pipefail

          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          if [[ -z "$DB_URL" ]]; then
            echo "DB_URL was not reported by the local Supabase stack." >&2
            exit 1
          fi

          failures=0
          total=0

          shopt -s nullglob
          test_files=(supabase/tests/*.sql)
          if [[ "${#test_files[@]}" -eq 0 ]]; then
            echo "No SQL integration test files found." >&2
            exit 1
          fi

          for test_file in "${test_files[@]}"; do
            total=$((total + 1))
            echo "::group::PostgreSQL integration test: $test_file"
            if psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$test_file"; then
              echo "PASS: $test_file"
            else
              echo "FAIL: $test_file" >&2
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done

          echo "::group::Concurrent campaign reservation test"
          if DB_URL="$DB_URL" bash supabase/tests/sitebin_sequential_campaign_concurrency.sh; then
            echo "PASS: concurrent single-capacity reservation"
          else
            echo "FAIL: concurrent single-capacity reservation" >&2
            failures=$((failures + 1))
          fi
          echo "::endgroup::"

          echo "SQL suites executed: $total"
          echo "Failed suites: $failures"
          if [[ "$failures" -ne 0 ]]; then
            exit 1
          fi

      - name: Verify local migration ledger after replay
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --local
          echo "PASS: the disposable local database reports its replayed migration ledger."

      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup

name: Session 2 - Supabase Local Database Verification

on:
  workflow_dispatch:
  push:
    branches:
      - db/session2-sequential-campaign-assignment-20261123
    paths:
      - "supabase/**"
      - ".github/workflows/session2-database-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"

permissions:
  contents: read

concurrency:
  group: sitebin-session2-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-migrations:
    name: Replay all Supabase migrations locally
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify CLI and initialize local config if absent
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          if [[ ! -f supabase/config.toml ]]; then
            supabase init
          fi
          test -d supabase/migrations
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | sort

      - name: Start disposable local Supabase stack
        run: supabase start

      - name: Replay migration history from an empty local database
        shell: bash
        run: |
          set -euo pipefail
          # Explicitly local: no project link, token, password, or remote URL is configured.
          supabase db reset --local

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Run sequential allocation integration tests
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          if [[ -z "$DB_URL" ]]; then
            echo "DB_URL was not reported by the local Supabase stack" >&2
            exit 1
          fi
          # Execute every suite even when an earlier one fails. Collect failures
          # and fail the job only after SQL and concurrency coverage has completed.
          test_failures=0
          for test_file in supabase/tests/*.sql; do
            echo "=== Running PostgreSQL integration test: $test_file ==="
            if psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$test_file"; then
              echo "PASS: $test_file"
            else
              echo "FAIL: $test_file" >&2
              test_failures=$((test_failures + 1))
            fi
          done

          echo "=== Running PostgreSQL concurrency integration test ==="
          if DB_URL="$DB_URL" bash supabase/tests/sitebin_sequential_campaign_concurrency.sh; then
            echo "PASS: sequential campaign concurrency"
          else
            echo "FAIL: sequential campaign concurrency" >&2
            test_failures=$((test_failures + 1))
          fi

          if [[ "$test_failures" -ne 0 ]]; then
            echo "FAIL: $test_failures PostgreSQL integration suite(s) failed" >&2
            exit 1
          fi

      - name: Verify migration history is readable
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --local

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

name: SiteBin Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Edge Function TypeScript
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate campaign preflight Edge Function and strict TypeScript types
        run: |
          deno check --no-lock supabase/functions/campaign-url-preflight/index.ts
          deno check --no-lock supabase/functions/verify-coin-purchase/index.ts
          deno check --no-lock supabase/functions/verify-myket-coin-purchase/index.ts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Require stable Debug signing secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64" || {
            echo "DEBUG_KEYSTORE_BASE64 is required. Refusing to generate or recover a Debug signing key from cache."
            exit 1
          }

      - name: Restore stable Debug signing key from secure secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "DEBUG_SIGNING_REQUIRED=true" >> "$GITHUB_ENV"

      - name: Verify stable Debug keystore identity
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256="B63BC4E1B46704CB4966AB3F0ED36FF9B7D999E967E61D3E6B69DACCA4C1669C"
          keystore="$HOME/.android/debug.keystore"
          output="$(keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey 2>/dev/null)"
          printf '%s\n' "$output"
          actual_sha256="$(printf '%s\n' "$output" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$actual_sha256" = "$expected_sha256" || {
            echo "Unexpected Debug certificate fingerprint: $actual_sha256"
            echo "Expected: $expected_sha256"
            exit 1
          }
          echo "Stable Debug keystore identity verified"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Supabase public API smoke test
        run: |
          set -euo pipefail
          SUPABASE_URL="$(sed -n 's/^SUPABASE_URL=//p' .env.example)"
          SUPABASE_PUBLISHABLE_KEY="$(sed -n 's/^SUPABASE_PUBLISHABLE_KEY=//p' .env.example)"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/duration_pricing?select=duration_seconds,advertiser_cost,keyword_advertiser_cost,viewer_reward&order=duration_seconds.asc" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -o /tmp/sitebin-duration-pricing.json
          python3 - <<'PY'
          import json
          with open('/tmp/sitebin-duration-pricing.json', encoding='utf-8') as f:
              rows = json.load(f)
          assert len(rows) == 5, f"expected 5 pricing rows, got {len(rows)}"
          expected = {5: (5, 15, 3), 10: (9, 27, 6), 15: (14, 42, 10), 30: (26, 78, 19), 60: (50, 150, 38)}
          for row in rows:
              d = row["duration_seconds"]
              assert d in expected, row
              assert (row["advertiser_cost"], row["keyword_advertiser_cost"], row["viewer_reward"]) == expected[d], row
          print("Supabase duration_pricing keyword smoke test passed")
          PY

      - name: Referral status RPC must use a read-only HTTP method
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_URL="$(sed -n 's/^SUPABASE_URL=//p' .env.example)"
          SUPABASE_PUBLISHABLE_KEY="$(sed -n 's/^SUPABASE_PUBLISHABLE_KEY=//p' .env.example)"
          code="$(curl --silent --show-error --output /tmp/sitebin-referral-status-unauth.json --write-out '%{http_code}' \
            -X GET "$SUPABASE_URL/rest/v1/rpc/get_referral_status" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")"
          if [[ "$code" == "405" ]]; then
            cat /tmp/sitebin-referral-status-unauth.json
            echo "Read-only referral status RPC incorrectly rejects GET."
            exit 1
          fi
          echo "Referral status GET route is accepted by PostgREST (unauthenticated response: HTTP $code)"

      - name: Campaign preflight authentication smoke test
        run: |
          set -euo pipefail
          SUPABASE_URL="$(sed -n 's/^SUPABASE_URL=//p' .env.example)"
          code="$(curl --silent --show-error --output /tmp/sitebin-preflight-unauth.json --write-out '%{http_code}'             -X POST "$SUPABASE_URL/functions/v1/campaign-url-preflight"             -H "Content-Type: application/json"             --data '{"url":"https://example.com"}')"
          test "$code" = "401"
          echo "Campaign preflight unauthenticated request correctly rejected"

      - name: Verify startup video source and legacy loader removal
        shell: bash
        run: |
          set -euo pipefail
          expected_video_sha256="22F17F1EE8B588B3A2A27F9ECC4FC17A8ED2852BBF6515B197EE7C6FE31C1DD8"
          actual_video_sha256="$(sha256sum app/src/main/res/raw/sitebin.mp4 | awk '{print toupper($1)}')"
          test "$actual_video_sha256" = "$expected_video_sha256"
          ! grep -R --line-number --fixed-strings "StartupLoadingBar" app/src/main/java
          grep -R --line-number --fixed-strings "R.raw.sitebin" app/src/main/java/com/example/MainActivity.kt
          grep -R --line-number --fixed-strings "windowSplashScreenAnimatedIcon" app/src/main/res/values-v31/themes.xml
          echo "Startup source, video identity and legacy loader removal verified"

      - name: Verify referral-push removal and tier-two reward amount
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'FirebaseMessaging|send-referral-push|registerReferralPushToken|setReferralNotificationsEnabled|referralNotificationsEnabled|اعلان‌های زیرمجموعه‌ها|register_push_token|set_referral_push_notifications_enabled|claim_referral_notifications|referral_notification_outbox|referral_push_tokens' app/src/main
          ! grep -n -E '۲۵٬۰۰۰|۲۵٬۵۰۰|25,000|25000' app/src/main/java/com/example/ui/screens/SiteBinHelpContent.kt docs/referral-system-deployment.md supabase/tests/sitebin_referral_rewards.sql
          grep -Fq 'v_amount := 20000;' supabase/migrations/20261013114207_sitebin_remove_referral_push_and_adjust_rewards.sql
          awk '/CREATE OR REPLACE FUNCTION private.rebind_user_account/ { inside=1 } inside && /referral_notification_outbox|referral_push_tokens/ { bad=1 } inside && /^\$function\$;/ { inside=0 } END { exit bad }' supabase/migrations/20261013121101_sitebin_fix_account_rebind_after_push_removal.sql
          ! grep -Fq 'Scaffold(' app/src/main/java/com/example/ui/screens/CampaignsScreen.kt
          grep -Fq 'PaddingValues(bottom = 112.dp)' app/src/main/java/com/example/ui/screens/CampaignsScreen.kt
          grep -Fq 'testTag("fab_add_campaign")' app/src/main/java/com/example/ui/screens/CampaignsScreen.kt

      - name: Verify weekly leaderboard podium layout
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'testTag("weekly_leaderboard_podium")' app/src/main/java/com/example/ui/screens/HomeScreen.kt
          grep -Fq 'testTag("weekly_leaderboard_rank_rows")' app/src/main/java/com/example/ui/screens/HomeScreen.kt
          grep -Fq 'testTag("weekly_leaderboard_current_rank")' app/src/main/java/com/example/ui/screens/HomeScreen.kt
          grep -Fq 'leaderboardPodiumOrdersRowsAsBronzeGoldSilverForVisualPlacement' app/src/test/java/com/example/ui/screens/HomeScreenBehaviorTest.kt
          grep -Fq 'leaderboardShowsOnlyTopFiveAndPlacesFourthAndFifthInRows' app/src/test/java/com/example/ui/screens/HomeScreenBehaviorTest.kt
          grep -Fq '.height(390.dp)' app/src/main/java/com/example/ui/screens/HomeScreen.kt
          grep -Fq '1 -> 168.dp' app/src/main/java/com/example/ui/screens/HomeScreen.kt
          grep -Fq '2 -> 140.dp' app/src/main/java/com/example/ui/screens/HomeScreen.kt
          grep -Fq 'else -> 116.dp' app/src/main/java/com/example/ui/screens/HomeScreen.kt
          grep -Fq '.size(if (displayRank == 1) 46.dp else 38.dp)' app/src/main/java/com/example/ui/screens/HomeScreen.kt
          grep -Fq 'color = rankColor' app/src/main/java/com/example/ui/screens/HomeScreen.kt
          grep -Fq 'fontSize = if (displayRank == 1) 25.sp else 22.sp' app/src/main/java/com/example/ui/screens/HomeScreen.kt
          grep -Fq 'fontSize = 16.sp' app/src/main/java/com/example/ui/screens/HomeScreen.kt

      - name: Unit tests
        run: gradle --no-daemon testBazaarDebugUnitTest testMyketDebugUnitTest

      - name: Enable KVM for Android WebView smoke tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Live Android WebView smoke tests for Eitaa and Bale public posts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle --no-daemon connectedBazaarDebugAndroidTest connectedMyketDebugAndroidTest

      - name: Build both store-specific Debug APKs
        run: gradle --no-daemon :app:assembleBazaarDebug :app:assembleMyketDebug

      - name: Verify bundled startup video bytes in both variants
        shell: bash
        run: |
          set -euo pipefail
          expected_video_sha256="22F17F1EE8B588B3A2A27F9ECC4FC17A8ED2852BBF6515B197EE7C6FE31C1DD8"
          rm -rf /tmp/sitebin-apk-check
          mkdir -p /tmp/sitebin-apk-check
          for flavor in bazaar myket; do
            apk="app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            extracted="/tmp/sitebin-apk-check/$flavor-sitebin.mp4"
            test -f "$apk"
            unzip -p "$apk" res/raw/sitebin.mp4 > "$extracted"
            actual_video_sha256="$(sha256sum "$extracted" | awk '{print toupper($1)}')"
            test "$actual_video_sha256" = "$expected_video_sha256"
            cmp -s app/src/main/res/raw/sitebin.mp4 "$extracted"
          done
          echo "Bundled startup video bytes verified unchanged in both variants"

      - name: Normalize Debug APK filenames
        shell: bash
        run: |
          set -euo pipefail
          for flavor in bazaar myket; do
            source_apk="app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            target_apk="app/build/outputs/apk/$flavor/debug/sitebin.azerakhsh.apk"
            test -f "$source_apk"
            mv "$source_apk" "$target_apk"
          done

      - name: Verify both Debug package names and signing identities
        shell: bash
        run: |
          set -euo pipefail
          expected_package="sitebin.azerakhsh.ir"
          expected_sha256="B63BC4E1B46704CB4966AB3F0ED36FF9B7D999E967E61D3E6B69DACCA4C1669C"
          for flavor in bazaar myket; do
            apk="app/build/outputs/apk/$flavor/debug/sitebin.azerakhsh.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            python3 - "$apk" "$expected_package" "$expected_sha256" <<'PY'
          import os
          import re
          import subprocess
          import sys

          apk, expected_package, expected_sha256 = sys.argv[1:]
          android_home = os.environ["ANDROID_HOME"]
          apksigner = os.path.join(android_home, "build-tools", "36.0.0", "apksigner")
          cert = subprocess.run(
              [apksigner, "verify", "--print-certs", apk],
              capture_output=True, text=True, check=True,
          )
          cert_output = cert.stdout + cert.stderr
          match = re.search(r"SHA-256 digest: ([0-9A-Fa-f:]+)", cert_output)
          assert match, "Debug APK certificate SHA-256 digest was not found"
          actual_sha256 = match.group(1).replace(":", "").upper()
          assert actual_sha256 == expected_sha256, f"unexpected Debug certificate: {actual_sha256}"

          aapt = os.path.join(android_home, "build-tools", "36.0.0", "aapt")
          package_output = subprocess.run(
              [aapt, "dump", "badging", apk], capture_output=True, text=True, check=True,
          ).stdout
          assert f"package: name='{expected_package}'" in package_output, "unexpected Debug Android package name"
          print("Debug APK package and signing identity verified")
          PY
          done

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sitebin-android-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/bazaar/debug/sitebin.azerakhsh.apk
            app/build/outputs/apk/myket/debug/sitebin.azerakhsh.apk

      - name: Remove temporary Debug keystore
        if: always()
        shell: bash
        run: rm -f "$HOME/.android/debug.keystore"

  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.event.head_commit.message == 'release: build production artifacts'
      )
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          echo "Release signing secrets are present"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Materialize temporary release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/sitebin-release.jks
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Build release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/sitebin-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleBazaarRelease :app:bundleBazaarRelease :app:assembleMyketRelease :app:bundleMyketRelease
          for flavor in bazaar myket; do
            source_apk="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            target_apk="app/build/outputs/apk/$flavor/release/sitebin.azerakhsh.apk"
            test -f "$source_apk"
            mv "$source_apk" "$target_apk"
          done
          for flavor in bazaar myket; do
            source_aab="app/build/outputs/bundle/${flavor}Release/app-${flavor}-release.aab"
            target_aab="app/build/outputs/bundle/${flavor}Release/sitebin.azerakhsh.aab"
            test -f "$source_aab"
            mv "$source_aab" "$target_aab"
          done

      - name: Verify release package and signing identity for both stores
        shell: bash
        run: |
          set -euo pipefail
          expected_package="sitebin.azerakhsh.ir"
          expected_sha256="6F259D3C4557BA4B4E4C9489F38BCD85E7EC9F4641C87346F9578BD0F4FF2900"
          for flavor in bazaar myket; do
            apk="app/build/outputs/apk/$flavor/release/sitebin.azerakhsh.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            python3 - "$apk" "$expected_package" "$expected_sha256" <<'PY'
          import os, re, subprocess, sys
          apk, expected_package, expected_sha256 = sys.argv[1:]
          android_home = os.environ["ANDROID_HOME"]
          apksigner = os.path.join(android_home, "build-tools", "36.0.0", "apksigner")
          cert = subprocess.run([apksigner, "verify", "--print-certs", apk], capture_output=True, text=True, check=True)
          cert_output = cert.stdout + cert.stderr
          match = re.search(r"SHA-256 digest: ([0-9A-Fa-f:]+)", cert_output)
          assert match, "APK certificate SHA-256 digest was not found"
          actual = match.group(1).replace(":", "").upper()
          assert actual == expected_sha256, f"unexpected release certificate: {actual}"
          aapt = os.path.join(android_home, "build-tools", "36.0.0", "aapt")
          package_output = subprocess.run([aapt, "dump", "badging", apk], capture_output=True, text=True, check=True).stdout
          assert f"package: name='{expected_package}'" in package_output, "unexpected Android package name"
          print("Release APK signature and package identity verified")
          PY
          done

          bundles=(app/build/outputs/bundle/bazaarRelease/*.aab app/build/outputs/bundle/myketRelease/*.aab)
          test "${#bundles[@]}" -eq 2
          for aab in "${bundles[@]}"; do
            jarsigner -verify -verbose -certs "$aab" >/tmp/sitebin-aab-signature.txt 2>&1
            AAB_PATH="$aab" python3 - <<'PY'
          import os, subprocess
          aab = os.environ["AAB_PATH"]
          expected_sha256 = "6F259D3C4557BA4B4E4C9489F38BCD85E7EC9F4641C87346F9578BD0F4FF2900"
          cert = subprocess.run(["keytool", "-printcert", "-jarfile", aab], capture_output=True, text=True, check=True)
          fingerprint = None
          for line in (cert.stdout + cert.stderr).splitlines():
              stripped = line.strip()
              if stripped.startswith("SHA256:") or stripped.startswith("SHA-256:"):
                  fingerprint = stripped.split(":", 1)[1].strip().replace(":", "").upper()
                  break
          assert fingerprint, "Release AAB SHA-256 certificate fingerprint was not found"
          assert fingerprint == expected_sha256, f"unexpected release AAB certificate: {fingerprint}"
          print("Release AAB certificate verified")
          PY
          done
          echo "Release signatures verified for Cafe Bazaar and Myket variants"
      - name: Generate release checksums
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/bazaar/release/sitebin.azerakhsh.apk
          sha256sum app/build/outputs/apk/myket/release/sitebin.azerakhsh.apk
          sha256sum app/build/outputs/bundle/bazaarRelease/*.aab
          sha256sum app/build/outputs/bundle/myketRelease/*.aab

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sitebin-android-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/bazaar/release/sitebin.azerakhsh.apk
            app/build/outputs/apk/myket/release/sitebin.azerakhsh.apk
            app/build/outputs/bundle/bazaarRelease/*.aab
            app/build/outputs/bundle/myketRelease/*.aab

      - name: Remove temporary release keystore
        if: always()
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/sitebin-release.jks
        run: rm -f "$KEYSTORE_PATH"

# Production release workflow is intentionally gated by an explicit release commit or manual dispatch.
# Release trigger marker: production APK identity and signature verification.
# Signing schemes: V1 + V2 + V3.

name: SiteBin Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Supabase public API smoke test
        run: |
          set -euo pipefail
          SUPABASE_URL="$(sed -n 's/^SUPABASE_URL=//p' .env.example)"
          SUPABASE_PUBLISHABLE_KEY="$(sed -n 's/^SUPABASE_PUBLISHABLE_KEY=//p' .env.example)"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/duration_pricing?select=duration_seconds&order=duration_seconds.asc" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -o /tmp/sitebin-duration-pricing.json
          python3 - <<'PY'
          import json
          with open('/tmp/sitebin-duration-pricing.json', encoding='utf-8') as f:
              rows = json.load(f)
          assert len(rows) == 5, f"expected 5 pricing rows, got {len(rows)}"
          print("Supabase duration_pricing smoke test passed")
          PY

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sitebin-android-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk

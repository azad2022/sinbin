name: SiteBin Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Require stable Debug signing secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64" || {
            echo "DEBUG_KEYSTORE_BASE64 is required. Refusing to generate or recover a Debug signing key from cache."
            exit 1
          }

      - name: Restore stable Debug signing key from secure secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "DEBUG_SIGNING_REQUIRED=true" >> "$GITHUB_ENV"

      - name: Verify stable Debug keystore identity
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256="B63BC4E1B46704CB4966AB3F0ED36FF9B7D999E967E61D3E6B69DACCA4C1669C"
          keystore="$HOME/.android/debug.keystore"
          output="$(keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey 2>/dev/null)"
          printf '%s\n' "$output"
          actual_sha256="$(printf '%s\n' "$output" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$actual_sha256" = "$expected_sha256" || {
            echo "Unexpected Debug certificate fingerprint: $actual_sha256"
            echo "Expected: $expected_sha256"
            exit 1
          }
          echo "Stable Debug keystore identity verified"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Supabase public API smoke test
        run: |
          set -euo pipefail
          SUPABASE_URL="$(sed -n 's/^SUPABASE_URL=//p' .env.example)"
          SUPABASE_PUBLISHABLE_KEY="$(sed -n 's/^SUPABASE_PUBLISHABLE_KEY=//p' .env.example)"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/duration_pricing?select=duration_seconds,advertiser_cost,keyword_advertiser_cost,viewer_reward&order=duration_seconds.asc" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -o /tmp/sitebin-duration-pricing.json
          python3 - <<'PY'
          import json
          with open('/tmp/sitebin-duration-pricing.json', encoding='utf-8') as f:
              rows = json.load(f)
          assert len(rows) == 5, f"expected 5 pricing rows, got {len(rows)}"
          expected = {5: (5, 15, 3), 10: (9, 27, 6), 15: (14, 42, 10), 30: (26, 78, 19), 60: (50, 150, 38)}
          for row in rows:
              d = row["duration_seconds"]
              assert d in expected, row
              assert (row["advertiser_cost"], row["keyword_advertiser_cost"], row["viewer_reward"]) == expected[d], row
          print("Supabase duration_pricing keyword smoke test passed")
          PY

      - name: Campaign preflight authentication smoke test
        run: |
          set -euo pipefail
          SUPABASE_URL="$(sed -n 's/^SUPABASE_URL=//p' .env.example)"
          code="$(curl --silent --show-error --output /tmp/sitebin-preflight-unauth.json --write-out '%{http_code}'             -X POST "$SUPABASE_URL/functions/v1/campaign-url-preflight"             -H "Content-Type: application/json"             --data '{"url":"https://example.com"}')"
          test "$code" = "401"
          echo "Campaign preflight unauthenticated request correctly rejected"

      - name: Verify startup video source and legacy loader removal
        shell: bash
        run: |
          set -euo pipefail
          expected_video_sha256="22F17F1EE8B588B3A2A27F9ECC4FC17A8ED2852BBF6515B197EE7C6FE31C1DD8"
          actual_video_sha256="$(sha256sum app/src/main/res/raw/sitebin.mp4 | awk '{print toupper($1)}')"
          test "$actual_video_sha256" = "$expected_video_sha256"
          ! grep -R --line-number --fixed-strings "StartupLoadingBar" app/src/main/java
          grep -R --line-number --fixed-strings "R.raw.sitebin" app/src/main/java/com/example/MainActivity.kt
          grep -R --line-number --fixed-strings "windowSplashScreenAnimatedIcon" app/src/main/res/values-v31/themes.xml
          echo "Startup source, video identity and legacy loader removal verified"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify bundled startup video bytes
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          expected_video_sha256="22F17F1EE8B588B3A2A27F9ECC4FC17A8ED2852BBF6515B197EE7C6FE31C1DD8"
          rm -rf /tmp/sitebin-apk-check
          mkdir -p /tmp/sitebin-apk-check
          unzip -p "$apk" res/raw/sitebin.mp4 > /tmp/sitebin-apk-check/sitebin.mp4
          actual_video_sha256="$(sha256sum /tmp/sitebin-apk-check/sitebin.mp4 | awk '{print toupper($1)}')"
          test "$actual_video_sha256" = "$expected_video_sha256"
          cmp -s app/src/main/res/raw/sitebin.mp4 /tmp/sitebin-apk-check/sitebin.mp4
          echo "Bundled startup video bytes verified unchanged"

      - name: Normalize debug APK filename
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/sitebin.azerakhsh.apk

      - name: Verify debug package and signing identity
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/sitebin.azerakhsh.apk"
          expected_package="sitebin.azerakhsh.ir"
          expected_sha256="B63BC4E1B46704CB4966AB3F0ED36FF9B7D999E967E61D3E6B69DACCA4C1669C"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"

          python3 - "$apk" "$expected_package" "$expected_sha256" <<'PY'
          import os
          import re
          import subprocess
          import sys

          apk, expected_package, expected_sha256 = sys.argv[1:]
          android_home = os.environ["ANDROID_HOME"]

          apksigner = os.path.join(android_home, "build-tools", "36.0.0", "apksigner")
          cert = subprocess.run(
              [apksigner, "verify", "--print-certs", apk],
              capture_output=True,
              text=True,
              check=True,
          )
          cert_output = cert.stdout + cert.stderr
          match = re.search(r"SHA-256 digest: ([0-9A-Fa-f:]+)", cert_output)
          assert match, "Debug APK certificate SHA-256 digest was not found"
          actual_sha256 = match.group(1).replace(":", "").upper()
          assert actual_sha256 == expected_sha256, (
              f"unexpected Debug certificate: {actual_sha256}"
          )

          aapt = os.path.join(android_home, "build-tools", "36.0.0", "aapt")
          package_output = subprocess.run(
              [aapt, "dump", "badging", apk],
              capture_output=True,
              text=True,
              check=True,
          ).stdout
          assert f"package: name='{expected_package}'" in package_output, (
              "unexpected Debug Android package name"
          )

          print("Debug APK package and signing identity verified")
          PY

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sitebin-android-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/sitebin.azerakhsh.apk

      - name: Remove temporary Debug keystore
        if: always()
        shell: bash
        run: rm -f "$HOME/.android/debug.keystore"

  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.event.head_commit.message == 'release: build production artifacts'
      )
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          echo "Release signing secrets are present"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Materialize temporary release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/sitebin-release.jks
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Build release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/sitebin-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease :app:bundleRelease
          test -f app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/sitebin.azerakhsh.apk

      - name: Verify release signatures
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/sitebin.azerakhsh.apk"
          bundles=(app/build/outputs/bundle/release/*.aab)
          test -f "$apk"
          test "${#bundles[@]}" -gt 0

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"

          python3 - "$apk" <<'PY'
          import os
          import re
          import subprocess
          import sys

          android_home = os.environ["ANDROID_HOME"]
          apk = sys.argv[1]
          expected_package = "sitebin.azerakhsh.ir"
          expected_sha256 = "6F259D3C4557BA4B4E4C9489F38BCD85E7EC9F4641C87346F9578BD0F4FF2900"

          cert = subprocess.run(
              [
                  os.path.join(android_home, "build-tools", "36.0.0", "apksigner"),
                  "verify",
                  "--print-certs",
                  apk,
              ],
              capture_output=True,
              text=True,
              check=True,
          )
          cert_output = cert.stdout + cert.stderr
          match = re.search(r"SHA-256 digest: ([0-9A-Fa-f:]+)", cert_output)
          assert match, "APK certificate SHA-256 digest was not found"
          actual_sha256 = match.group(1).replace(":", "").upper()
          assert actual_sha256 == expected_sha256, (
              f"unexpected release certificate: {actual_sha256}"
          )

          package_output = subprocess.run(
              [
                  os.path.join(android_home, "build-tools", "36.0.0", "aapt"),
                  "dump",
                  "badging",
                  apk,
              ],
              capture_output=True,
              text=True,
              check=True,
          ).stdout
          assert f"package: name='{expected_package}'" in package_output, (
              "unexpected Android package name"
          )

          print("Release APK signature and package identity verified")
          PY

          for aab in "${bundles[@]}"; do
            echo "Verifying $aab"
            jarsigner -verify -verbose -certs "$aab" >/tmp/sitebin-aab-signature.txt 2>&1

            python3 - "$aab" <<'PY'
            import subprocess
            import sys

            aab = sys.argv[1]
            expected_sha256 = "6F259D3C4557BA4B4E4C9489F38BCD85E7EC9F4641C87346F9578BD0F4FF2900"

            cert = subprocess.run(
                ["keytool", "-printcert", "-jarfile", aab],
                capture_output=True,
                text=True,
                check=True,
            )

            fingerprint = None
            for line in (cert.stdout + cert.stderr).splitlines():
                stripped = line.strip()
                if stripped.startswith("SHA256:") or stripped.startswith("SHA-256:"):
                    fingerprint = stripped.split(":", 1)[1].strip().replace(":", "").upper()
                    break

            assert fingerprint, "Release AAB SHA-256 certificate fingerprint was not found"
            assert fingerprint == expected_sha256, (
                f"unexpected release AAB certificate: {fingerprint}"
            )

            print("Release AAB certificate verified")
            PY
          done
          echo "Release AAB signatures and certificate identity verified"
      - name: Generate release checksums
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/release/sitebin.azerakhsh.apk
          sha256sum app/build/outputs/bundle/release/*.aab

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sitebin-android-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/sitebin.azerakhsh.apk
            app/build/outputs/bundle/release/*.aab

      - name: Remove temporary release keystore
        if: always()
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/sitebin-release.jks
        run: rm -f "$KEYSTORE_PATH"

# Production release workflow is intentionally gated by an explicit release commit or manual dispatch.
# Release trigger marker: production APK identity and signature verification.
# Signing schemes: V1 + V2 + V3.
